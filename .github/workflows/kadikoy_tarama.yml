name: Kadıköy fiyat taraması (tek seferlik)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          python -m pip install -q -r requirements.txt \
            || python -m pip install -q --break-system-packages -r requirements.txt
      - name: Tara
        run: python kadikoy_tarama.py
      - name: Sonuçları kaydet
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raporlar/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Kadıköy fiyat raporu [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
