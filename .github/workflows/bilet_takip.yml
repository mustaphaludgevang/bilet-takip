name: Bilet Takip

on:
  schedule:
    # Her 10 dakikada bir (UTC). GitHub zamanlanmış işleri yoğunlukta geciktirebilir.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_modu:
        description: "Sahte test sayfasıyla dene (gerçek state'e dokunmaz)"
        type: boolean
        default: false
      ozet_gonder:
        description: "Sadece yaklaşan satışların özetini tek bildirimle gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bilet-takip
  cancel-in-progress: false

jobs:
  # Hızlı yol: sadece özet bildirimi (tarayıcı gerekmez)
  ozet:
    if: ${{ inputs.ozet_gonder }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SUMMARY_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests tzdata && python takip_ozet.py

  takip:
    if: ${{ !inputs.ozet_gonder }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Chromium ve tüm sistem kütüphaneleri hazır kurulu resmi imaj (kurulum beklemesi yok)
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TZ: Europe/Istanbul
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Bağımlılıkları kur
        run: |
          python -m pip install -q -r requirements.txt \
            || python -m pip install -q --break-system-packages -r requirements.txt

      - name: Takibi çalıştır
        if: ${{ !inputs.test_modu }}
        run: python takip.py

      - name: TEST - sahte sayfayla çalıştır
        if: ${{ inputs.test_modu }}
        env:
          VENUE_URLS: "file://${{ github.workspace }}/test/mekan.html|Test Mekanı"
          STATE_PATH: /tmp/test_state.json
          ICS_PATH: /tmp/test.ics
        run: |
          python takip.py
          echo "----- test state -----"; cat /tmp/test_state.json

      - name: State dosyasını commit et
        if: ${{ always() && !inputs.test_modu }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events_state.json satis_takvimi.ics 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "state: $(date '+%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep 5
          done
          echo "Push başarısız" && exit 1
